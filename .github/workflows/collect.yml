name: Écoutes (toutes les 30 min)

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Récupérer les écoutes
        env:
          SPOTIFY_CLIENT_ID:     ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          LISTENBRAINZ_TOKEN:    ${{ secrets.LISTENBRAINZ_TOKEN }}
        run: python scripts/collect_listens.py

      - name: Recalculer le tableau de bord
        run: python scripts/build_site.py

      - name: Commiter s'il y a du nouveau
        run: |
          git config user.name  "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add data site/data
          git diff --staged --quiet || git commit -m "écoutes $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase --autostash || true
          git push
