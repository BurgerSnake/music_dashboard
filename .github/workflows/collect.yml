name: Écoutes (toutes les 30 min)

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Récupérer les écoutes
        env:
          SPOTIFY_CLIENT_ID:     ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          LISTENBRAINZ_TOKEN:    ${{ secrets.LISTENBRAINZ_TOKEN }}
        run: python scripts/collect_listens.py

      - name: Publier les données
        run: |
          git config user.name  "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"

          # 1. on committe NOS fichiers d'abord : plus rien d'intraçable ne traîne,
          #    sinon un fichier non suivi (actions_log.jsonl) bloque le pull.
          git add data/listens data/state.json
          git diff --staged --quiet || git commit -m "écoutes $(date -u +%Y-%m-%dT%H:%M)"

          # 2. on récupère ce que le site a écrit pendant l'exécution
          git pull --rebase

          # 3. on recalcule APRÈS, pour tenir compte de ces écritures
          python scripts/build_site.py
          git add site/data
          git diff --staged --quiet || git commit -m "tableau de bord"

          # 4. push avec relances : une autre Action peut avoir poussé entre-temps
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push refusé, nouvelle tentative $i"
            sleep $((i * 5)); git pull --rebase || true
          done
          git push
