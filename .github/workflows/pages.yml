name: Publier le site

on:
  # Après chaque workflow qui régénère les données.
  # IMPORTANT : un commit fait par GITHUB_TOKEN ne déclenche PAS un workflow "push",
  # d'où ce déclencheur workflow_run, qui lui fonctionne.
  workflow_run:
    workflows: ["Écoutes (toutes les 30 min)", "Synchro quotidienne", "File d'actions"]
    types: [completed]
  push:
    branches: [ main ]
    paths: [ "site/**" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: "site" }
      - id: deployment
        uses: actions/deploy-pages@v4
