name: Sorties (bihebdomadaire)

# Les sorties d'albums bougent à la semaine, pas à l'heure.
# Deux passages suffisent.

on:
  schedule:
    - cron: "10 4 * * 1,4"    # lundi et jeudi
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sorties d'albums (MusicBrainz)
        continue-on-error: true
        run: python scripts/fetch_releases.py

      - name: Publier
        run: |
          git config user.name  "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add data/releases.json data/mbid_cache.json
          git diff --staged --quiet || git commit -m "sorties $(date -u +%F)"
          git pull --rebase
          python scripts/build_site.py
          git add site/data
          git diff --staged --quiet || git commit -m "tableau de bord"
          for i in 1 2 3 4 5; do git push && exit 0; sleep $((i*5)); git pull --rebase || true; done
          git push
