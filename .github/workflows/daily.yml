name: Synchro quotidienne

on:
  schedule:
    - cron: "20 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      HOME_LAT: "50.4108"
      HOME_LON: "4.4446"
      RADIUS_KM: "350"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Bibliothèque Spotify
        continue-on-error: true
        env:
          SPOTIFY_CLIENT_ID:     ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: python scripts/sync_library.py

      - name: Vinyles Discogs
        continue-on-error: true
        env:
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          DISCOGS_USER:  ${{ secrets.DISCOGS_USER }}
        run: python scripts/sync_discogs.py

      - name: Sorties d'albums (MusicBrainz)
        continue-on-error: true
        run: python scripts/fetch_releases.py

      - name: Concerts à proximité (Ticketmaster)
        continue-on-error: true
        env:
          TICKETMASTER_KEY: ${{ secrets.TICKETMASTER_KEY }}
        run: python scripts/fetch_events.py

      - name: Images (Deezer, sans clé)
        continue-on-error: true
        run: python scripts/fetch_images.py

      - name: Publier les données
        run: |
          git config user.name  "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"

          # 1. on committe NOS fichiers d'abord : plus rien d'intraçable ne traîne,
          #    sinon un fichier non suivi (actions_log.jsonl) bloque le pull.
          git add data/library.json data/vinyl.json data/releases.json data/events.json data/images.json data/mbid_cache.json
          git diff --staged --quiet || git commit -m "synchro quotidienne $(date -u +%F)"

          # 2. on récupère ce que le site a écrit pendant l'exécution
          git pull --rebase

          # 3. on recalcule APRÈS, pour tenir compte de ces écritures
          python scripts/build_site.py
          git add site/data
          git diff --staged --quiet || git commit -m "tableau de bord"

          # 4. push avec relances : une autre Action peut avoir poussé entre-temps
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push refusé, nouvelle tentative $i"
            sleep $((i * 5)); git pull --rebase || true
          done
          git push
